<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
<title id="title">7xAnime adaptive launcher icon foreground</title>

<defs>
  <linearGradient id="sevenFill" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.72" stop-color="#f3efff"/>
    <stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <linearGradient id="xFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff69bd"/>
    <stop offset="0.48" stop-color="#ff2f9d"/>
    <stop offset="1" stop-color="#c50072"/>
  </linearGradient>
</defs>
<!-- Angular brush-stroke 7: sharp cuts give the mark an anime action-line silhouette. -->
<path d="M64 78 L445 63 L412 137 L337 152 L150 435 L72 435 L247 152 L52 168 Z" fill="url(#sevenFill)"/>
<path d="M88 99 L164 96 L109 113 Z M383 86 L424 82 L405 105 Z M151 397 L188 322 L166 406 Z" fill="#ffffff" opacity=".78"/>
<!-- The pink x sits just off the descending stroke so the white numeral still reads unmistakably as 7. -->
<path d="M284 253 L316 226 L366 275 L412 225 L447 252 L400 300 L440 341 L408 371 L366 330 L323 370 L290 341 L334 299 Z" fill="url(#xFill)"/>
<path d="M290 247 L316 226 L346 254 L317 247 Z M408 225 L447 252 L425 273 L436 250 Z M410 371 L386 348 L410 355 L428 346 Z" fill="#ff9bd2" opacity=".9"/>
<path d="M444 220 L461 204 L471 216 L454 236 Z M282 361 L298 346 L312 362 L296 377 Z" fill="#ff2f9d"/>

</svg>