<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
<title id="title">7xAnime adaptive launcher icon foreground</title>

<defs>
  <linearGradient id="sevenFill" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.72" stop-color="#f3efff"/>
    <stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <linearGradient id="xFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff69bd"/>
    <stop offset="0.48" stop-color="#ff2f9d"/>
    <stop offset="1" stop-color="#c50072"/>
  </linearGradient>
</defs>
<!-- Angular brush-stroke 7: sharp cuts give the mark an anime action-line silhouette. -->
<path d="M68 82 L442 68 L414 136 L330 151 L202 430 L124 430 L251 151 L58 164 Z" fill="url(#sevenFill)"/>
<path d="M88 99 L164 96 L109 113 Z M383 86 L424 82 L405 105 Z M151 397 L188 322 L166 406 Z" fill="#ffffff" opacity=".78"/>
<!-- The magenta x cuts through the 7's diagonal so the two characters read as one fused mark. -->
<path d="M238 253 L270 226 L320 275 L366 225 L401 252 L354 300 L394 341 L362 371 L320 330 L277 370 L244 341 L288 299 Z" fill="url(#xFill)"/>
<path d="M244 247 L270 226 L300 254 L271 247 Z M362 225 L401 252 L379 273 L390 250 Z M364 371 L340 348 L364 355 L382 346 Z" fill="#ff9bd2" opacity=".9"/>
<path d="M210 250 L225 241 L249 266 L236 276 Z M398 220 L415 204 L425 216 L408 236 Z M236 361 L252 346 L266 362 L250 377 Z" fill="#ff2f9d"/>

</svg>