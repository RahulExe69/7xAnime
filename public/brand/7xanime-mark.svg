<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">7xAnime fused anime-style 7x app mark</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17111f"/><stop offset="1" stop-color="#07070b"/></linearGradient>
    <radialGradient id="ambience" cx="58%" cy="46%" r="60%"><stop stop-color="#c21878" stop-opacity=".25"/><stop offset="1" stop-color="#09090f" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="267" cy="254" r="230" fill="url(#ambience)"/>
  <g filter="url(#glow)" opacity=".32"><path d="M70 86 L433 71 L409 135 L302 151 L204 424 L134 424 L250 151 L62 161 Z" fill="#ff2f9d"/></g>
  
<defs>
  <linearGradient id="sevenFill" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.72" stop-color="#f3efff"/>
    <stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <linearGradient id="xFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff69bd"/>
    <stop offset="0.48" stop-color="#ff2f9d"/>
    <stop offset="1" stop-color="#c50072"/>
  </linearGradient>
</defs>
<!-- Angular brush-stroke 7: sharp cuts give the mark an anime action-line silhouette. -->
<path d="M70 86 L433 71 L409 135 L302 151 L204 424 L134 424 L250 151 L62 161 Z" fill="url(#sevenFill)"/>
<path d="M91 103 L174 99 L116 116 Z M373 89 L414 86 L399 103 Z M165 389 L191 324 L174 398 Z" fill="#ffffff" opacity=".78"/>
<!-- The magenta x cuts through the 7's diagonal so the two characters read as one fused mark. -->
<path d="M224 253 L256 226 L306 275 L352 225 L387 252 L340 300 L380 341 L348 371 L306 330 L263 370 L230 341 L274 299 Z" fill="url(#xFill)"/>
<path d="M230 247 L256 226 L286 254 L257 247 Z M348 225 L387 252 L365 273 L376 250 Z M350 371 L326 348 L350 355 L368 346 Z" fill="#ff9bd2" opacity=".9"/>
<path d="M196 250 L211 241 L235 266 L222 276 Z M384 220 L401 204 L411 216 L394 236 Z M222 361 L238 346 L252 362 L236 377 Z" fill="#ff2f9d"/>

  <path d="M355 112 L405 80 L375 132 Z M112 348 L138 332 L120 377 Z M397 382 L425 363 L408 399 Z" fill="#ff2f9d" opacity=".9"/>
</svg>