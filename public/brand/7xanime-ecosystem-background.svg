<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">7xAnime static background</title>
  <desc id="desc">Scalable vector gradient background using the 7xAnime brand palette. No logo or foreground artwork is included.</desc>
  <defs>
    <radialGradient id="glow-secondary" cx="20%" cy="12%" r="78%">
      <stop offset="0" stop-color="#D51C8A" stop-opacity=".34"/>
      <stop offset=".46" stop-color="#D51C8A" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D51C8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-primary" cx="86%" cy="78%" r="84%">
      <stop offset="0" stop-color="#FF315E" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#FF315E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FF315E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-accent" cx="8%" cy="94%" r="65%">
      <stop offset="0" stop-color="#FF86C7" stop-opacity=".19"/>
      <stop offset=".54" stop-color="#FF86C7" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FF86C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-lift" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#FF315E" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FF315E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="#1E0D1B"/>
  <rect width="1080" height="1080" fill="url(#glow-secondary)"/>
  <rect width="1080" height="1080" fill="url(#glow-primary)"/>
  <rect width="1080" height="1080" fill="url(#glow-accent)"/>
  <rect width="1080" height="1080" fill="url(#center-lift)"/>
</svg>
