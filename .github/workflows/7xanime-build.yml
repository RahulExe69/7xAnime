name: 7xAnime APK Builder

on:
  pull_request:
    branches:
      - master
      - fix/player-embed-pip-background
  workflow_dispatch:
    inputs:
      build_type:
        description: Choose which APK to build
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      version_name:
        description: MAJOR.MINOR.PATCH
        required: true
        type: string
        default: "1.0.0"
      release_notes:
        description: Optional release notes (release builds only)
        required: false
        type: string
        default: ""
      compare_apk_sizes:
        description: Run the slower three-variant release APK size audit after the debug build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 7xanime-apk-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  debug-apk:
    if: github.event_name == 'pull_request' || inputs.build_type == 'debug'
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_LOCAL_BACKEND: "1"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
      NEXT_PUBLIC_POCKETBASE_URL: "http://127.0.0.1:8090"
      NEXT_PUBLIC_PROXY_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned Kuhi backend source
        run: bash .github/scripts/fetch-kuhi-backend.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.ref }}-
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android backend test dependencies
        run: python -m pip install --disable-pip-version-check -r android-local-backend/requirements-android.txt

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Resolve Android version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(node -p 'require("./package.json").version')"
          fi
          bash .github/scripts/android-version.sh "${VERSION}" >> "${GITHUB_ENV}"

      - name: Build static web bundle
        run: npm run build:android-web

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install splash image tooling
        run: python -m pip install --disable-pip-version-check Pillow CairoSVG

      - name: Configure Android debug build
        run: |
          set -euo pipefail
          python3 .github/scripts/configure-capacitor-android.py
          python3 .github/scripts/configure-local-anime-backend.py
          test -s android/app/src/main/java/com/sevenx/anime/UpdateBridge.java
          grep -q 'addJavascriptInterface(updateBridge, "Android")' android/app/src/main/java/com/sevenx/anime/MainActivity.java
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/file_paths.xml

      - name: Verify native ad blocking and fullscreen wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          java_root = Path("android/app/src/main/java/com/sevenx/anime")
          required = {
              "StreamingNavigationWebViewClient.java",
              "StreamingServiceWorkerClient.java",
              "AdblockFilterEngine.java",
              "StreamingWebChromeClient.java",
              "PlayerFullscreenPlugin.java",
              "LocalAnimeBackendPlugin.java",
          }
          missing = sorted(name for name in required if not (java_root / name).is_file())
          if missing:
              raise SystemExit(f"Native player integration files missing: {missing}")

          main_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(main_files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(main_files)}")
          main_activity = main_files[0].read_text(encoding="utf-8")
          expected_wiring = (
              "registerPlugin(PlayerFullscreenPlugin.class)",
              "StreamingNavigationWebViewClient(getBridge())",
              "ServiceWorkerController.getInstance().setServiceWorkerClient(new StreamingServiceWorkerClient())",
              "AdblockFilterEngine.initialize(getApplicationContext())",
              "setWebChromeClient(streamingWebChromeClient)",
              "streamingWebChromeClient.handleBackPressed()",
              "streamingWebChromeClient.stopFullscreenForBackground()",
              "applySevenXSystemBarTheme();",
              "installPlayerSwipeObserver();",
              "setStatusBarColor",
              "setNavigationBarColor",
              "setNavigationBarContrastEnforced",
              "onPictureInPictureModeChanged(boolean isInPictureInPictureMode, Configuration newConfig)",
          )
          missing_wiring = [item for item in expected_wiring if item not in main_activity]
          if missing_wiring:
              raise SystemExit(f"MainActivity native wiring missing: {missing_wiring}")

          nav = (java_root / "StreamingNavigationWebViewClient.java").read_text(encoding="utf-8")
          chrome = (java_root / "StreamingWebChromeClient.java").read_text(encoding="utf-8")
          service_worker = (java_root / "StreamingServiceWorkerClient.java").read_text(encoding="utf-8")
          adblock = (java_root / "AdblockFilterEngine.java").read_text(encoding="utf-8")
          app_gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          variables = Path("android/variables.gradle").read_text(encoding="utf-8")
          root_gradle = Path("android/build.gradle").read_text(encoding="utf-8")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties").read_text(encoding="utf-8")
          android_manifest_text = Path("android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          if "io.github.mlm-games:adblock:0.1.3" not in app_gradle:
              raise SystemExit("Maintained adblock-rust Android dependency is missing")
          if "getDefaultProguardFile('proguard-android-optimize.txt')" not in app_gradle and 'getDefaultProguardFile("proguard-android-optimize.txt")' not in app_gradle:
              raise SystemExit("AGP 9 ProGuard default compatibility patch is missing")
          if "minifyEnabled true" not in app_gradle or "shrinkResources true" not in app_gradle:
              raise SystemExit("Release builds must enable R8 minification and Android resource shrinking")
          if "proguard-7xanime-rules.pro" not in app_gradle or not Path("android/app/proguard-7xanime-rules.pro").is_file():
              raise SystemExit("7xAnime R8 keep rules were not attached to the generated app")
          capacitor_app_gradle = Path("node_modules/@capacitor/app/android/build.gradle").read_text(encoding="utf-8")
          if "getDefaultProguardFile('proguard-android.txt')" in capacitor_app_gradle or 'getDefaultProguardFile("proguard-android.txt")' in capacitor_app_gradle:
              raise SystemExit("AGP 9 legacy ProGuard default remains in @capacitor/app")
          if "getDefaultProguardFile('proguard-android-optimize.txt')" not in capacitor_app_gradle and 'getDefaultProguardFile("proguard-android-optimize.txt")' not in capacitor_app_gradle:
              raise SystemExit("AGP 9 ProGuard default patch is missing from @capacitor/app")
          if "compileSdkVersion = 37" not in variables:
              raise SystemExit("Android compileSdk must be 37 for the adblock-rust AAR")
          if "com.android.tools.build:gradle:9.1.1" not in root_gradle:
              raise SystemExit("Android Gradle Plugin 9.1.1 is required for API 37")
          if "gradle-9.3.1-bin.zip" not in wrapper:
              raise SystemExit("Gradle 9.3.1 is required by Android Gradle Plugin 9.1.1")
          for item, text in (
              ("BLOCKED_AD_DOMAINS", nav),
              ("shouldInterceptRequest", nav),
              ("shouldInterceptRequest", service_worker),
              ("AdblockFilterEngine.intercept", nav),
              ("AdblockFilterEngine.intercept", service_worker),
              ("AdblockEngine.Companion.create()", adblock),
              ("loadFilterList", adblock),
              ("loadResources", adblock),
              ("FILTER_REFRESH_INTERVAL_MS", adblock),
              ("https://easylist.to/easylist/easylist.txt", adblock),
              ("serializeTo", adblock),
              ("ServiceWorkerController", main_activity),
              ("Build.VERSION_CODES.N", main_activity),
              ("onCreateWindow", chrome),
              ("onJsConfirm", chrome),
              ("onPermissionRequest", chrome),
              ("handleBackPressed", chrome),
              ("reportBlockedPlayerAction", chrome),
              ("reportBlockedNavigation", nav),
              ("stopFullscreenForBackground", chrome),
              ("onStop()", main_activity),
              ("onReceivedError", nav),
              ("onReceivedHttpError", nav),
              ("isEmbeddedPlayerDocument", nav),
              ("enterPictureInPicture", (java_root / "PlayerFullscreenPlugin.java").read_text(encoding="utf-8")),
          ):
              if item not in text:
                  raise SystemExit(f"Native ad/fullscreen feature missing: {item}")

          # WebView can report the top-level URL for dialogs created by nested iframes
          # on some OEM Chromium builds. Never delegate JS dialogs to Android's default UI.
          for callback in ("onJsAlert", "onJsConfirm", "onJsPrompt"):
              start = chrome.index("public boolean " + callback)
              end = chrome.find("\n    @Override", start)
              body = chrome[start:] if end < 0 else chrome[start:end]
              if "result.cancel()" not in body or "return true;" not in body:
                  raise SystemExit(f"{callback} must cancel immediately and suppress the native dialog")
              if "super." + callback in body:
                  raise SystemExit(f"{callback} must not delegate to the default WebChromeClient dialog")
          if "onJsBeforeUnload" not in chrome or "result.confirm()" not in chrome:
              raise SystemExit("Native before-unload dialog suppression is missing")
          if 'android:supportsPictureInPicture="true"' not in android_manifest_text:
              raise SystemExit("Android manifest is not PiP-capable")
          if 'android:resizeableActivity="true"' not in android_manifest_text:
              raise SystemExit("Android Activity is not resizeable for PiP")
          if "screenSize" not in android_manifest_text or "smallestScreenSize" not in android_manifest_text:
              raise SystemExit("Android Activity configuration does not retain PiP resize changes")

          watch_section = Path("src/app/anime/watch/video-player-section.tsx").read_text(encoding="utf-8")
          local_api_text = Path("android-local-backend/local_api.py").read_text(encoding="utf-8")
          server_map = Path("src/lib/server-map.ts").read_text(encoding="utf-8")
          player_component = Path("src/components/video-player.tsx").read_text(encoding="utf-8")
          update_gate = Path("src/components/force-update-gate.tsx").read_text(encoding="utf-8")
          viewport = Path("src/components/player-viewport.tsx").read_text(encoding="utf-8")
          if "7xanime:blocked-player-action" not in watch_section:
              raise SystemExit("Player page is not wired to blocked-ad auto-switch events")
          if "deceptiveInterstitial" not in watch_section:
              raise SystemExit("Deceptive interstitials must advance to another provider")
          if "YouTube-style double tap" not in player_component or "art.seek = targetTime" not in player_component:
              raise SystemExit("Double-tap ±10-second seeking wiring missing")
          if "SWIPE_THRESHOLD" not in viewport or "enterNativePlayerFullscreen" not in viewport:
              raise SystemExit("Player swipe/fullscreen wiring missing")
          if "enterNativePictureInPicture" not in viewport or 'data-player-viewport="true"' not in viewport:
              raise SystemExit("Native PiP player control or viewport marker is missing")
          persistent_host = Path("src/components/persistent-watch-experience.tsx").read_text(encoding="utf-8")
          watch_page = Path("src/app/anime/watch/page.tsx").read_text(encoding="utf-8")
          layout = Path("src/app/layout.tsx").read_text(encoding="utf-8")
          css = Path("src/app/globals.css").read_text(encoding="utf-8")
          if "PersistentWatchExperience" not in layout:
              raise SystemExit("Persistent player host is not mounted from the root layout")
          if "MotionEvent.ACTION_UP" not in main_activity:
              raise SystemExit("Native embedded-player swipe observation is not installed")
          if "7xanime:native-player-swipe" not in viewport:
              raise SystemExit("Embedded-player swipe events are not handled in the viewport")
          if 'data-persistent-watch-player="true"' not in persistent_host or "lastWatchHrefRef" not in persistent_host:
              raise SystemExit("Persistent player session/restore routing is missing")
          for action in ("expand-mini-player", "minimize-player", "close-mini-player"):
              if f'dispatchPlayerAction("{action}")' not in viewport:
                  raise SystemExit(f"Player action is missing: {action}")
          if '[data-persistent-watch-player][data-player-mode="mini"]' not in css:
              raise SystemExit("Mini-player browse-mode styling is missing")
          if "return null" not in watch_page:
              raise SystemExit("Watch route must not mount a duplicate player")
          if "appStateChange" not in watch_section or "sevenx-pip-mode" not in watch_section:
              raise SystemExit("Background playback stop / PiP lifecycle handling is missing")
          if "getLocalWatchProgress" not in watch_section or "requestEmbedResume" not in watch_section:
              raise SystemExit("Cross-server watch-progress resume handling is missing")
          if "onEpisodeEnded?: () => void" not in player_component or 'art.on("video:ended"' not in player_component:
              raise SystemExit("Native video-ended callback is missing")
          if "advanceToNextEpisode" not in watch_section or "episode-" not in watch_section:
              raise SystemExit("Automatic next-episode routing is missing")
          if 'useState<boolean>(() => isLocalBackendEnabled())' not in watch_section:
              raise SystemExit("Android must start on Server 1 without requiring a manual server tap")
          if "aniembed:ended" not in watch_section or "lastWatchParamsRef.current = {" not in watch_section:
              raise SystemExit("Embedded ended events or mini-player episode state sync is missing")
          if "if (nativeCatalogueComplete && !catalogueEpisode)" not in watch_section:
              raise SystemExit("Auto-next must stop at the end of a complete native episode catalogue")
          if "normalizeEventName" not in watch_section or "eventNames.some((name)" not in watch_section:
              raise SystemExit("Embedded completion events must normalize provider-specific end signals")
          if "legacyId?: string" not in player_component or "animeInfo.legacyId" not in player_component:
              raise SystemExit("Legacy local watch-progress keys must remain readable")
          if "progressAnimeId" not in watch_section:
              raise SystemExit("Embedded watch-progress stable-key fallback is missing")
          if "onLoad={requestEmbedResume}" not in watch_section:
              raise SystemExit("Embedded players are not asked to resume after loading")
          if 'status === "checking") return null' not in update_gate:
              raise SystemExit("The update gate must remain invisible while checking for an update")
          if 'ACTIVE_PROVIDER_ORDER = ("anixo", "megavid", "tryembed", "cinexstream")' not in local_api_text:
              raise SystemExit("Android active provider allowlist has unexpected servers")
          retired_names = ("animeparadise", "megaflix", "nontongo")
          if any(name in server_map.lower() for name in retired_names):
              raise SystemExit("Retired providers must not be registered in the selectable catalogue")
          if any(name in local_api_text.lower() for name in retired_names):
              raise SystemExit("Retired providers must not be registered in the Android backend")
          if any(provider not in watch_section for provider in ("tryembed", "cinexstream")):
              raise SystemExit("Provider stall watchdog does not cover every enabled embed")
          if "const playerReady =" not in watch_section:
              raise SystemExit("Ready-page events must be distinguished from actual playback")
          if 'observedEmbedProvider === "tryembed" ? 8000 : 18000' not in watch_section:
              raise SystemExit("TryEmbed interstitial timeout is missing")
          if "Blocked navigation to known advertising host" not in nav:
              raise SystemExit("Known ad-network document navigation is not blocked")

          # The shared WebView interception layer must stay provider-agnostic.
          # Guard against provider-specific comparisons, while allowing the source comments to mention examples.
          nav_lower = nav.lower()
          provider_specific_checks = ('equals("megavid")', 'equals("nontongo")', '"megavid".equals', '"nontongo".equals')
          if any(pattern in nav_lower for pattern in provider_specific_checks):
              raise SystemExit("Ad-filter routing must not be restricted to selected provider names")
          brand_icon = Path("public/brand/7xanime-icon.png")
          brand_wordmark = Path("public/brand/7xanime-wordmark.png")
          if not brand_icon.is_file() or not brand_wordmark.is_file():
              raise SystemExit("Approved 7xAnime icon/wordmark PNG assets are missing")
          navbar = Path("src/components/navbar.tsx").read_text(encoding="utf-8")
          manifest = Path("public/manifest.json").read_text(encoding="utf-8")
          if '/brand/7xanime-wordmark.png' not in navbar:
              raise SystemExit("The application header does not use the approved wordmark")
          if '/brand/7xanime-icon.png' not in manifest:
              raise SystemExit("The PWA manifest does not use the approved app icon")
          launcher_dir = Path("android/app/src/main/res/mipmap-nodpi")
          launcher_icon = launcher_dir / "ic_launcher.png"
          alias_file = Path("android/app/src/main/res/values/7xanime-launcher-aliases.xml")
          if not launcher_icon.is_file() or launcher_icon.read_bytes() != brand_icon.read_bytes():
              raise SystemExit("The single no-crop launcher bitmap must exactly match the approved PNG")
          if not alias_file.is_file():
              raise SystemExit("Launcher resource aliases are missing")
          alias_text = alias_file.read_text(encoding="utf-8")
          for alias_name in ("ic_launcher_round", "ic_launcher_static", "ic_launcher_static_round"):
              if f'name="{alias_name}"' not in alias_text or "@mipmap/ic_launcher" not in alias_text:
                  raise SystemExit(f"Launcher resource alias missing or invalid: {alias_name}")
          duplicate_launcher_files = [
              name for name in ("ic_launcher_round.png", "ic_launcher_static.png", "ic_launcher_static_round.png")
              if (launcher_dir / name).exists()
          ]
          if duplicate_launcher_files:
              raise SystemExit("Duplicate launcher PNGs inflate the APK: " + ", ".join(duplicate_launcher_files))
          adaptive_icons = list(Path("android/app/src/main/res").rglob("ic_launcher*.xml"))
          if adaptive_icons:
              raise SystemExit(
                  "Adaptive launcher XML would mask/crop the approved full artwork: "
                  + ", ".join(str(path) for path in adaptive_icons)
              )
          stale_density_icons = [
              path
              for folder in Path("android/app/src/main/res").glob("mipmap-*")
              if folder != launcher_dir and folder.is_dir()
              for path in folder.glob("ic_launcher*.png")
          ]
          if stale_density_icons:
              raise SystemExit(
                  "Old resized launcher bitmaps remain outside mipmap-nodpi: "
                  + ", ".join(str(path) for path in stale_density_icons)
              )
          if "Megavid safety note" in watch_section or "NontonGo safety note" in watch_section:
              raise SystemExit("Provider-specific warning cards should not be shown in the player UI")
          if "public/brand/7xanime-icon.png" not in Path("README.md").read_text(encoding="utf-8"):
              raise SystemExit("README does not use the approved icon branding")
          if "public/brand/7xanime-wordmark.png" not in Path("README.md").read_text(encoding="utf-8"):
              raise SystemExit("README does not use the approved wordmark branding")
          launcher_script = Path(".github/scripts/configure-capacitor-android.py").read_text(encoding="utf-8")
          if 'brand_icon = brand_dir / "7xanime-icon.png"' not in launcher_script or 'launcher_dir = resource_root / "mipmap-nodpi"' not in launcher_script:
              raise SystemExit("Android launcher generation must use the approved PNG as a no-density bitmap")
          if "adaptive icon" not in launcher_script or "ic_launcher*.xml" not in launcher_script:
              raise SystemExit("Launcher generation must explicitly remove adaptive icon XML to avoid mask-driven cropping")
          if "Image.Resampling.LANCZOS" in launcher_script or "ic_launcher_foreground.png" in launcher_script:
              raise SystemExit("Launcher script must not resize or redraw the approved source icon")
          print("Provider-agnostic filter-list engine, warning-card removal, approved 7xAnime branding, fullscreen and seeking gestures are wired.")
          PY

      # Test the exact patched Python tree that Chaquopy packages in the APK,
      # not the raw upstream checkout that still contains Python 3.12-only syntax.
      - name: Smoke test minimal packaged provider set
        env:
          PYTHONPATH: android/app/src/main/python:android-local-backend
        run: |
          python - <<'PY'
          import local_api
          from fastapi.testclient import TestClient
          from src.providers import _race

          expected_modules = {"anixo", "megavid", "tryembed", "cinexstream"}
          providers = _race.providers()
          loaded_names = {name for name, _ in providers}
          print("Packaged active providers:", ", ".join(name for name, _ in providers))
          if loaded_names != expected_modules:
              raise SystemExit(
                  f"Expected exactly {sorted(expected_modules)}, got {sorted(loaded_names)}"
              )
          provider_dir = Path("android/app/src/main/python/src/providers")
          retired_modules = {"animeparadise.py", "megaflix.py", "nontongo.py", "animenosub.py"}
          bundled_retired = sorted(path.name for path in provider_dir.glob("*.py") if path.name in retired_modules)
          if bundled_retired:
              raise SystemExit(f"Retired provider modules were bundled: {bundled_retired}")

          assert local_api._episode_number_from_slug("anineko-12") == 12
          assert local_api._episode_number_from_slug("episode-3") == 3
          assert local_api._validated_remote_url("https://example.com/master.m3u8").startswith("https://")
          try:
              local_api._validated_remote_url("http://127.0.0.1/private")
          except ValueError:
              pass
          else:
              raise SystemExit("Loopback URL validation did not reject a private target")

          with TestClient(local_api.app) as client:
              health = client.get("/api/health")
              assert health.status_code == 200 and health.json()["status"] == "ok"
              unauthorized = client.get("/spotlight")
              assert unauthorized.status_code == 403
              preflight = client.options(
                  "/spotlight",
                  headers={
                      "Origin": "https://localhost",
                      "Access-Control-Request-Method": "GET",
                      "Access-Control-Request-Headers": "x-7xanime-token",
                  },
              )
              assert preflight.status_code == 200
              assert preflight.headers.get("access-control-allow-origin") == "https://localhost"
              status = client.get(
                  "/api/diagnostics/providers",
                  headers={"X-7xAnime-Token": local_api.get_token()},
              )
              assert status.status_code == 200, status.text
              reported = {item["id"] for item in status.json()["providers"] if item["moduleLoaded"]}
              active_manual = {
                  "anixo", "megavid", "tryembed", "cinexstream",
              }
              assert active_manual <= reported, (
                  "Diagnostics do not list all approved manual providers: "
                  f"{sorted(active_manual - reported)}"
              )
              assert reported <= active_manual, (
                  "Parked providers leaked into active diagnostics: "
                  f"{sorted(reported - active_manual)}"
              )
          print(
              "Packaged API: all 18 adapter modules imported; only four approved "
              "manual choices are exposed; health, auth, diagnostics and CORS passed."
          )
          PY

      - name: Run packaged API contract tests
        env:
          PYTHONPATH: android/app/src/main/python:android-local-backend
        run: python .github/scripts/test-local-anime-backend.py

      - name: Install Android API 37 platform
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ ! -x "${SDKMANAGER}" ]]; then
            echo "Android sdkmanager was not found." >&2
            exit 1
          fi
          (yes || true) | "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" "platforms;android-37.0"

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug             --no-daemon             --parallel             --build-cache             --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "${APK}" ]]; then
            echo "::error::Debug APK was not generated at ${APK}"
            exit 1
          fi

          mkdir -p artifacts
          OUTPUT="artifacts/7xAnime-v${VERSION_NAME}-debug.apk"
          cp "${APK}" "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

          {
            echo "## 7xAnime debug build"
            echo
            echo "- Version: ${VERSION_NAME}"
            echo "- Android versionCode: ${VERSION_CODE}"
            echo "- Package: `com.sevenx.anime.debug`"
            echo "- APK: `$(basename "${OUTPUT}")`"
            echo "- SHA-256: `$(cut -d' ' -f1 "${OUTPUT}.sha256")`"
            echo "- Release signing: not used"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7xAnime-v${{ env.VERSION_NAME }}-debug-apk
          path: artifacts/7xAnime-v${{ env.VERSION_NAME }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug checksum
        uses: actions/upload-artifact@v4
        with:
          name: 7xAnime-v${{ env.VERSION_NAME }}-debug-checksum
          path: artifacts/7xAnime-v${{ env.VERSION_NAME }}-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # Build unoptimized universal, optimized universal, and optimized ARM64
      # variants from the same sources to measure each size reduction.
      - name: Compare release APK size variants
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' && inputs.compare_apk_sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/size-audit

          # Clean once before generating Chaquopy's R8 rules. Repeated clean
          # commands delete build/python/proguard-rules.pro between variants,
          # while Gradle may consider its generation task up to date.
          (
            cd android
            ./gradlew clean --no-daemon --parallel --build-cache --stacktrace
          )

          build_variant() {
            local label="$1"
            local abis="$2"
            local minify="$3"
            local shrink="$4"
            echo "::group::Build ${label} (ABIs=${abis}, R8=${minify}, resource shrink=${shrink})"
            export ANDROID_ABI_FILTERS="${abis}"
            export ANDROID_RELEASE_MINIFY="${minify}"
            export ANDROID_RELEASE_SHRINK_RESOURCES="${shrink}"
            python3 .github/scripts/configure-capacitor-android.py
            python3 .github/scripts/configure-local-anime-backend.py
            rm -f android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
            (
              cd android
              chmod +x gradlew
              ./gradlew assembleRelease --no-daemon --parallel --build-cache --stacktrace
            )
            local apk="android/app/build/outputs/apk/release/app-release.apk"
            if [[ ! -s "${apk}" ]]; then
              apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            fi
            test -s "${apk}"
            cp "${apk}" "artifacts/size-audit/${label}.apk"
            echo "Built ${label}: $(stat -c%s "artifacts/size-audit/${label}.apk") bytes"
            echo "::endgroup::"
          }

          build_variant "universal-unoptimized" "arm64-v8a,x86_64" "false" "false"
          build_variant "universal-optimized" "arm64-v8a,x86_64" "true" "true"
          build_variant "arm64-optimized" "arm64-v8a" "true" "true"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("artifacts/size-audit")
          variants = [
              ("Universal, no R8/resource shrink", "universal-unoptimized.apk"),
              ("Universal, R8 + resource shrink", "universal-optimized.apk"),
              ("ARM64, R8 + resource shrink", "arm64-optimized.apk"),
          ]
          sizes = [(label, name, (root / name).stat().st_size) for label, name in variants]
          baseline = sizes[0][2]
          universal_optimized = sizes[1][2]
          arm64_optimized = sizes[2][2]
          def mib(value: int) -> str:
              return f"{value / 1048576:.2f} MiB"
          def reduction(before: int, after: int) -> str:
              return f"{(before - after) / 1048576:.2f} MiB ({(before - after) * 100 / before:.1f}%)"
          report = [
              "# 7xAnime APK size comparison",
              "",
              "| Variant | Size | Change versus baseline |",
              "|---|---:|---:|",
              f"| {sizes[0][0]} | {mib(baseline)} | Baseline |",
              f"| {sizes[1][0]} | {mib(universal_optimized)} | {reduction(baseline, universal_optimized)} |",
              f"| {sizes[2][0]} | {mib(arm64_optimized)} | {reduction(baseline, arm64_optimized)} |",
              "",
              f"- R8/resource-shrink effect (universal): {reduction(baseline, universal_optimized)}",
              f"- Architecture split effect (optimized universal → ARM64): {reduction(universal_optimized, arm64_optimized)}",
              "- These are unsigned release-build size comparisons, not publishable APKs.",
              "",
          ]
          text = "\n".join(report)
          (root / "REPORT.md").write_text(text, encoding="utf-8")
          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(summary.read_text(encoding="utf-8") + text, encoding="utf-8")
          print(text)
          PY

      - name: Upload APK size comparison
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug' && inputs.compare_apk_sizes
        uses: actions/upload-artifact@v4
        with:
          name: 7xAnime-v${{ env.VERSION_NAME }}-apk-size-audit
          path: artifacts/size-audit/
          if-no-files-found: error
          retention-days: 30

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
    name: Build and publish signed Release APK
    uses: ./.github/workflows/7xanime-release.yml
    with:
      version: ${{ inputs.version_name }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit
