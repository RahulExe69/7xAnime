name: 7xAnime UI Build Check

on:
  pull_request:
    branches:
      - master
      - fix/player-embed-pip-background

permissions:
  contents: read

concurrency:
  group: 7xanime-ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-web-build:
    name: Validate UI and static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These reserved example domains are compile-time placeholders only.
      # This job never publishes an app or an APK.
      NEXT_PUBLIC_API_URL: https://api.example.invalid
      NEXT_PUBLIC_POCKETBASE_URL: https://pocketbase.example.invalid
      NEXT_PUBLIC_PROXY_URL: https://proxy.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.ref }}-
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Validate backend bootstrap scripts
        run: |
          python3 -m py_compile pocketbase/init-collections.py .github/scripts/configure-capacitor-android.py .github/scripts/configure-local-anime-backend.py .github/scripts/configure-release-signing.py android-local-backend/local_api.py
          sh -n pocketbase/entrypoint.sh
          bash -n .github/scripts/fetch-kuhi-backend.sh

      - name: Validate local Docker Compose
        run: |
          cp .env.backend.example .env.backend
          docker compose config --quiet

      - name: Verify web media proxy safety and streaming contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proxy = Path("src/app/api/proxy/route.ts").read_text(encoding="utf-8")
          required = {
              "Node runtime for DNS validation": 'export const runtime = "nodejs"',
              "dynamic response handling": 'export const dynamic = "force-dynamic"',
              "manual redirect validation": 'redirect: "manual"',
              "public IP validation": "isNonPublicAddress",
              "DNS resolution checks": 'lookup(host, { all: true, verbatim: true })',
              "range request forwarding": 'request.headers.get("range")',
              "conditional range forwarding": 'request.headers.get("if-range")',
              "streamed media response": "new NextResponse(response.body",
          }
          missing = [label for label, snippet in required.items() if snippet not in proxy]
          if missing:
              raise SystemExit(f"Web media proxy safeguards are missing: {missing}")
          if "response.arrayBuffer()" in proxy:
              raise SystemExit("Web media proxy must not buffer full media responses")

          viewport = Path("src/components/player-viewport.tsx").read_text(encoding="utf-8")
          player = Path("src/app/anime/watch/video-player-section.tsx").read_text(encoding="utf-8")
          viewport_required = {
              "mini-player interaction shield": 'data-mini-player-interaction-shield="true"',
              "provider control-hide requests": "requestEmbeddedControlsHidden",
              "tap-to-show mini-player controls": "revealMiniControls();",
              "temporary mini-player controls": "}, 3500);",
              "initially hidden mini-player controls": 'miniControlsVisible ? "pointer-events-auto opacity-100" : "pointer-events-none opacity-0"',
              "animated player geometry transition": "node.animate([",
              "mini-player drag start": "const startMiniDrag = useCallback(",
              "mini-player drag movement": "const moveMiniPlayer = useCallback(",
              "mini-player offset transform": "--mini-player-offset",
          }
          player_required = {
              "explicit provider pause detection": "const reportedPaused = eventNames.some(",
              "paused-state watchdog guard": 'if (embedPlaybackStateRef.current === "paused")',
              "pause preservation during recovery": "pauseAfterEmbedRecoveryRef.current = true;",
              "post-recovery pause command": "requestExternalPlayerPause(frameAtSchedule)",
              "paused-player errors cannot trigger reconnects": "const pausedFrame = externalEmbedFrameRef.current;",
          }
          missing_viewport = [label for label, snippet in viewport_required.items() if snippet not in viewport]
          missing_player = [label for label, snippet in player_required.items() if snippet not in player]
          if missing_viewport or missing_player:
              raise SystemExit(
                  f"Mini-player interaction/pause protections are missing: "
                  f"viewport={missing_viewport}, player={missing_player}"
              )
          print("Web proxy and mini-player safety contracts passed.")
          PY

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build static web bundle
        run: npm run build:android-web

      - name: Verify exported home page
        run: test -s out/index.html
