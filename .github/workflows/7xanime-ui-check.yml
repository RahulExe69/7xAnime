name: 7xAnime UI Build Check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7xanime-ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-web-build:
    name: Validate UI and static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These reserved example domains are compile-time placeholders only.
      # This job never publishes an app or an APK.
      NEXT_PUBLIC_API_URL: https://api.example.invalid
      NEXT_PUBLIC_POCKETBASE_URL: https://pocketbase.example.invalid
      NEXT_PUBLIC_PROXY_URL: https://proxy.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate backend bootstrap scripts
        run: |
          python3 -m py_compile pocketbase/init-collections.py .github/scripts/configure-capacitor-android.py .github/scripts/configure-local-anime-backend.py android-local-backend/local_api.py
          sh -n pocketbase/entrypoint.sh
          bash -n .github/scripts/fetch-kuhi-backend.sh

      - name: Validate local Docker Compose
        run: |
          cp .env.backend.example .env.backend
          docker compose config --quiet

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefer-offline --no-audit

      - name: Build static web bundle
        run: npm run build:android-web

      - name: Verify exported home page
        run: test -s out/index.html
