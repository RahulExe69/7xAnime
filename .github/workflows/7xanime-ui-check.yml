name: 7xAnime UI Build Check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: 7xanime-ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-generated-lockfile:
    # One-time lockfile reconciliation for this trusted maintenance branch only.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/7xanime-perf-reliability'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the lockfile from the declared dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile with Capacitor dependencies"
          git push origin "HEAD:${BRANCH_NAME}"

  static-web-build:
    name: Validate UI and static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These reserved example domains are compile-time placeholders only.
      # This job never publishes an app or an APK.
      NEXT_PUBLIC_API_URL: https://api.example.invalid
      NEXT_PUBLIC_POCKETBASE_URL: https://pocketbase.example.invalid
      NEXT_PUBLIC_PROXY_URL: https://proxy.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate backend bootstrap scripts
        run: |
          python3 -m py_compile pocketbase/init-collections.py .github/scripts/configure-capacitor-android.py .github/scripts/configure-local-anime-backend.py .github/scripts/configure-release-signing.py android-local-backend/local_api.py
          sh -n pocketbase/entrypoint.sh
          bash -n .github/scripts/fetch-kuhi-backend.sh

      - name: Validate local Docker Compose
        run: |
          cp .env.backend.example .env.backend
          docker compose config --quiet

      - name: Verify web media proxy safety and streaming contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proxy = Path("src/app/api/proxy/route.ts").read_text(encoding="utf-8")
          required = {
              "Node runtime for DNS validation": 'export const runtime = "nodejs"',
              "dynamic response handling": 'export const dynamic = "force-dynamic"',
              "manual redirect validation": 'redirect: "manual"',
              "public IP validation": "isNonPublicAddress",
              "DNS resolution checks": 'lookup(host, { all: true, verbatim: true })',
              "range request forwarding": 'request.headers.get("range")',
              "conditional range forwarding": 'request.headers.get("if-range")',
              "streamed media response": "new NextResponse(response.body",
          }
          missing = [label for label, snippet in required.items() if snippet not in proxy]
          if missing:
              raise SystemExit(f"Web media proxy safeguards are missing: {missing}")
          if "response.arrayBuffer()" in proxy:
              raise SystemExit("Web media proxy must not buffer full media responses")
          print("Web media proxy validation, redirect and streaming contracts passed.")
          PY

      - name: Reconcile lockfile with declared Capacitor dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload reconciled lockfile for verification
        uses: actions/upload-artifact@v4
        with:
          name: 7xanime-lockfile-sync
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build static web bundle
        run: npm run build:android-web

      - name: Verify exported home page
        run: test -s out/index.html
