name: 7xAnime Signed Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version in MAJOR.MINOR.PATCH format"
        required: true
        type: string
      release_notes:
        description: "Optional release notes (leave blank to generate notes from commits)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: 7xanime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build, sign, verify, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_LOCAL_BACKEND: "1"
      NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
      NEXT_PUBLIC_POCKETBASE_URL: "http://127.0.0.1:8090"
      NEXT_PUBLIC_PROXY_URL: ""

    steps:
      - name: Checkout source with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release secrets before building
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD RELEASE_REPO_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret ${name} is missing."
              exit 1
            fi
          done
          echo "Required signing and release-publishing secrets are configured."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android backend test dependencies
        run: python -m pip install --disable-pip-version-check -r android-local-backend/requirements-android.txt

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RAW_VERSION="${INPUT_VERSION:-}"
          if [[ ! "${RAW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 1.0.3."
            exit 1
          fi
          bash .github/scripts/android-version.sh "${RAW_VERSION}" >> "${GITHUB_ENV}"
          echo "version=${RAW_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Decode permanent release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/7xanime-release.keystore.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          keytool -list -keystore "${KEYSTORE_PATH}" -storetype JKS -alias "${ANDROID_KEY_ALIAS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"
          echo "Persistent release keystore decoded and alias validated."

      - name: Fetch pinned Kuhi backend source
        run: bash .github/scripts/fetch-kuhi-backend.sh

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefer-offline --no-audit

      - name: Build static web bundle
        run: npm run build:android-web

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install splash image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Configure Android project and native updater
        env:
          ANDROID_ABI_FILTERS: "arm64-v8a,x86_64"
          ANDROID_RELEASE_MINIFY: "true"
          ANDROID_RELEASE_SHRINK_RESOURCES: "true"
        run: |
          set -euo pipefail
          python3 .github/scripts/configure-capacitor-android.py
          python3 .github/scripts/configure-local-anime-backend.py

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/configure-release-signing.py

      - name: Verify native updater wiring
        run: |
          set -euo pipefail
          test -s android/app/src/main/java/com/sevenx/anime/UpdateBridge.java
          grep -q 'addJavascriptInterface(updateBridge, "Android")' android/app/src/main/java/com/sevenx/anime/MainActivity.java
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/file_paths.xml

      - name: Install Android API 37 platform
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ ! -x "${SDKMANAGER}" ]]; then
            echo "Android sdkmanager was not found." >&2
            exit 1
          fi
          (yes || true) | "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" "platforms;android-37.0"

      - name: Compile signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache --stacktrace

      - name: Verify signature and package universal release APK
        id: package
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "${APK}" ]]; then
            echo "::error::Gradle did not produce a universal release APK."
            exit 1
          fi
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "${APK}"
          "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${APK}"
          BADGING="$("${BUILD_TOOLS_DIR}/aapt" dump badging "${APK}")"
          grep -q "package: name='com.sevenx.anime'" <<< "${BADGING}" || {
            echo "::error::Release package id must be com.sevenx.anime."
            exit 1
          }
          grep -q "native-code:.*arm64-v8a" <<< "${BADGING}" || {
            echo "::error::Universal APK is missing arm64-v8a native libraries."
            exit 1
          }
          grep -q "native-code:.*x86_64" <<< "${BADGING}" || {
            echo "::error::Universal APK is missing x86_64 native libraries."
            exit 1
          }
          mkdir -p artifacts
          OUTPUT="artifacts/7xAnime-v${VERSION_NAME}.apk"
          cp "${APK}" "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"
          SHA256="$(cut -d' ' -f1 "${OUTPUT}.sha256")"
          SIZE_BYTES="$(stat -c%s "${OUTPUT}")"
          SIZE_MB="$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES}/1048576}")"
          echo "apk_file=${OUTPUT}" >> "${GITHUB_OUTPUT}"
          echo "apk_sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "apk_size_mb=${SIZE_MB}" >> "${GITHUB_OUTPUT}"
          {
            echo "## 7xAnime v${VERSION_NAME} universal release"
            echo
            echo "- Package: com.sevenx.anime"
            echo "- Android versionCode: ${VERSION_CODE}"
            echo "- APK: $(basename "${OUTPUT}")"
            echo "- Size: ${SIZE_MB} MiB"
            echo "- Architectures: arm64-v8a, x86_64"
            echo "- SHA-256: ${SHA256}"
            echo "- Signing: permanent 7xAnime release keystore; signature verified"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure and compile ARM64-only release APK
        env:
          ANDROID_ABI_FILTERS: "arm64-v8a"
        run: |
          set -euo pipefail
          python3 .github/scripts/configure-local-anime-backend.py
          chmod +x android/gradlew
          (
            cd android
            ./gradlew clean assembleRelease --no-daemon --parallel --build-cache --stacktrace
          )

      - name: Verify signature and package ARM64-only release APK
        id: package-arm64
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "${APK}" ]]; then
            echo "::error::Gradle did not produce an ARM64-only release APK."
            exit 1
          fi
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "${APK}"
          "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${APK}"
          BADGING="$("${BUILD_TOOLS_DIR}/aapt" dump badging "${APK}")"
          grep -q "package: name='com.sevenx.anime'" <<< "${BADGING}" || {
            echo "::error::ARM64 release package id must be com.sevenx.anime."
            exit 1
          }
          grep -q "native-code:.*arm64-v8a" <<< "${BADGING}" || {
            echo "::error::ARM64-only APK is missing arm64-v8a native libraries."
            exit 1
          }
          if grep -q "native-code:.*x86_64" <<< "${BADGING}"; then
            echo "::error::ARM64-only APK unexpectedly contains x86_64 native libraries."
            exit 1
          fi
          OUTPUT="artifacts/7xAnime-v${VERSION_NAME}-arm64-v8a.apk"
          cp "${APK}" "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"
          SHA256="$(cut -d' ' -f1 "${OUTPUT}.sha256")"
          SIZE_BYTES="$(stat -c%s "${OUTPUT}")"
          SIZE_MB="$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES}/1048576}")"
          UNIVERSAL_BYTES="$(stat -c%s "artifacts/7xAnime-v${VERSION_NAME}.apk")"
          SAVED_BYTES="$((UNIVERSAL_BYTES - SIZE_BYTES))"
          SAVED_MB="$(awk "BEGIN {printf \"%.2f\", ${SAVED_BYTES}/1048576}")"
          SAVED_PCT="$(awk "BEGIN {if (${UNIVERSAL_BYTES} > 0) printf \"%.1f\", ${SAVED_BYTES}*100/${UNIVERSAL_BYTES}; else print \"0.0\"}")"
          echo "arm64_apk_file=${OUTPUT}" >> "${GITHUB_OUTPUT}"
          echo "arm64_apk_sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "arm64_apk_size_mb=${SIZE_MB}" >> "${GITHUB_OUTPUT}"
          {
            echo "## 7xAnime v${VERSION_NAME} ARM64-only release"
            echo
            echo "- APK: $(basename "${OUTPUT}")"
            echo "- Size: ${SIZE_MB} MiB"
            echo "- Universal APK: ${OUTPUT/ -arm64-v8a/}"
            echo "- Saved versus universal APK: ${SAVED_MB} MiB (${SAVED_PCT}%)"
            echo "- Native architecture: arm64-v8a only"
            echo "- SHA-256: ${SHA256}"
            echo "- Signing: permanent 7xAnime release keystore; signature verified"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish versioned release to public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          APK_FILE: ${{ steps.package.outputs.apk_file }}
          APK_SHA256: ${{ steps.package.outputs.apk_sha256 }}
          APK_SIZE_MB: ${{ steps.package.outputs.apk_size_mb }}
          ARM64_APK_FILE: ${{ steps.package-arm64.outputs.arm64_apk_file }}
          ARM64_APK_SHA256: ${{ steps.package-arm64.outputs.arm64_apk_sha256 }}
          ARM64_APK_SIZE_MB: ${{ steps.package-arm64.outputs.arm64_apk_size_mb }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
          PUBLIC_RELEASE_REPO: RahulExe69/7xAnime-Releases
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          TITLE="7xAnime ${TAG}"
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_REPO_TOKEN is required to publish to ${PUBLIC_RELEASE_REPO}."
            exit 1
          fi
          PREVIOUS_TAG="$(gh api "repos/${PUBLIC_RELEASE_REPO}/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)"
          if [[ -n "${PREVIOUS_TAG}" && "${PREVIOUS_TAG}" != "${TAG}" ]]; then
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
            if [[ "${PREVIOUS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              PREVIOUS_CODE="$(bash .github/scripts/android-version.sh "${PREVIOUS_VERSION}" | awk -F= '$1 == "VERSION_CODE" {print $2}')"
              if [[ -n "${PREVIOUS_CODE}" ]] && (( PREVIOUS_CODE > VERSION_CODE )); then
                echo "::error::Refusing to publish ${TAG}; latest is ${PREVIOUS_TAG}."
                exit 1
              fi
            else
              echo "::warning::Latest release tag '${PREVIOUS_TAG}' is not a plain semantic version; skipping numeric comparison."
            fi
          fi
          NOTES="${CUSTOM_NOTES}"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            NOTES="$(git log -n 12 --no-merges --pretty=format:'- %s' | grep -v -E '^(Merge |chore: initialize)' || true)"
          fi
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            NOTES="- Official Android release with permanent signing and the update system."
          fi
          cat > release-notes.md <<EOF
          ## 7xAnime ${TAG}

          ${NOTES}

          ### Build information

          - Universal APK: $(basename "${APK_FILE}")
          - Package: com.sevenx.anime
          - Android versionCode: ${VERSION_CODE}
          - Universal size: ${APK_SIZE_MB} MiB (arm64-v8a + x86_64)
          - Universal SHA-256: ${APK_SHA256}
          - Compact ARM64 APK: $(basename "${ARM64_APK_FILE}")
          - ARM64 size: ${ARM64_APK_SIZE_MB} MiB (arm64-v8a only)
          - ARM64 SHA-256: ${ARM64_APK_SHA256}
          - Release build: R8 minification and Android resource shrinking enabled

          The unsuffixed universal APK is uploaded first for compatibility with older in-app updaters.
          Newer 7xAnime builds select the architecture-specific APK when the device ABI is supported.

          <!-- source-sha: ${GITHUB_SHA} -->
          EOF
          if gh release view "${TAG}" --repo "${PUBLIC_RELEASE_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_FILE}" "${APK_FILE}.sha256" "${ARM64_APK_FILE}" "${ARM64_APK_FILE}.sha256" --repo "${PUBLIC_RELEASE_REPO}" --clobber
            gh release edit "${TAG}" --repo "${PUBLIC_RELEASE_REPO}" --title "${TITLE}" --notes-file release-notes.md
          else
            gh release create "${TAG}" "${APK_FILE}" "${APK_FILE}.sha256" "${ARM64_APK_FILE}" "${ARM64_APK_FILE}.sha256" --repo "${PUBLIC_RELEASE_REPO}" --title "${TITLE}" --notes-file release-notes.md
          fi
          echo "Published ${TAG} to https://github.com/${PUBLIC_RELEASE_REPO}/releases/tag/${TAG}"

      - name: Upload release APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7xAnime-v${{ steps.version.outputs.version }}-signed-release
          path: |
            ${{ steps.package.outputs.apk_file }}
            ${{ steps.package.outputs.apk_file }}.sha256
            ${{ steps.package-arm64.outputs.arm64_apk_file }}
            ${{ steps.package-arm64.outputs.arm64_apk_file }}.sha256
          if-no-files-found: error
          retention-days: 90
